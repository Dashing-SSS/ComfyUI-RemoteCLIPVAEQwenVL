[tool.comfy]
# 发布者 ID：registry.comfy.org 个人页 @ 后面那一串（创建后不可改）
PublisherId = "YOUR-PUBLISHER-ID"
DisplayName = "RemoteCLIPVAE + QwenVL Remote"
Icon = ""
requires-comfyui = ">=0.3.0"
