[project]
name = "comfyui-remoteclipvae-qwenvl"
version = "1.0.0"
description = "双机 ComfyUI 分离套件：远程 CLIP/VAE/文本编码 + 远程 QwenVL 图生文/提示词增强/视频反推，本机只留 UNet 与前端，重活全在 RemoteCLIPVAE 服务端"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
